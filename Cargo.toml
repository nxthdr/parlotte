[workspace]
resolver = "2"
members = [
    "crates/parlotte-core",
    "crates/parlotte-ffi",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "sqlite", "markdown"] }
matrix-sdk-ui = { version = "0.18" }
futures-util = "0.3"
uniffi = { version = "0.31" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release profile tuned for binary size. The Rust core statically links the
# whole matrix-sdk tree, so an untuned release binary is large. `strip` drops
# symbol tables and `codegen-units = 1` lets the optimizer produce tighter
# code. We deliberately avoid `lto = true`: for a `staticlib` consumed by
# Xcode's linker it emits LLVM bitcode (bloating the `.a` and forcing a
# fragile, version-sensitive LTO step onto ld). We keep unwinding (no
# `panic = "abort"`) because UniFFI converts panics into errors across FFI.
[profile.release]
strip = true
codegen-units = 1
