## Test overrides — loaded alongside the main homeserver.yaml

enable_registration: true
enable_registration_without_verification: true
suppress_key_server_warning: true

# Make the user directory return all users (not just those sharing a room),
# so user-search integration tests are deterministic.
user_directory:
  enabled: true
  search_all_users: true

# Allow room directory publication
allow_public_rooms_without_auth: true
allow_public_rooms_over_federation: false
room_list_publication_rules:
  - action: allow

# Disable rate limiting for tests
rc_message:
  per_second: 1000
  burst_count: 1000
rc_registration:
  per_second: 1000
  burst_count: 1000
rc_login:
  address:
    per_second: 1000
    burst_count: 1000
  account:
    per_second: 1000
    burst_count: 1000
  failed_attempts:
    per_second: 1000
    burst_count: 1000
